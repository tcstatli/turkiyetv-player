<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Türkiye TV YouTube Player</title>
<style>
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#player-wrap{position:fixed;left:0;top:0;width:100%;height:100%;background:#000}
#yt-player{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
#message{position:absolute;z-index:10;left:50%;top:50%;width:80%;transform:translate(-50%,-50%);color:#fff;text-align:center;font-size:26px;line-height:1.4;display:none}
#message.visible{display:block}
#message small{display:block;margin-top:12px;color:#aaa;font-size:18px}
</style>
</head>
<body>
<div id="player-wrap">
<iframe id="yt-player" title="YouTube Player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="message"></div>
</div>
<script>
(function(){
"use strict";
var iframe=document.getElementById("yt-player");
var messageEl=document.getElementById("message");
var player=null;
var params=getQueryParams();
var origin=window.location.origin;

function getQueryParams(){
    var result={}, query=window.location.search.substring(1), parts=query?query.split("&"):[], i, pair;
    for(i=0;i<parts.length;i+=1){
        pair=parts[i].split("=");
        if(pair[0]){
            result[decodeURIComponent(pair[0])]=decodeURIComponent((pair[1]||"").replace(/\+/g," "));
        }
    }
    return result;
}
function showMessage(text,detail){
    messageEl.innerHTML="";
    messageEl.appendChild(document.createTextNode(text));
    if(detail){
        var small=document.createElement("small");
        small.appendChild(document.createTextNode(detail));
        messageEl.appendChild(small);
    }
    messageEl.className="visible";
}
function hideMessage(){messageEl.className="";}
function postToParent(type,data){
    if(window.parent===window){return;}
    try{window.parent.postMessage({source:"turkiyetv-youtube-bridge",type:type,data:data||null},"*");}catch(ignore){}
}
function buildSource(){
    var common="autoplay=1&controls=1&playsinline=1&enablejsapi=1&origin="+encodeURIComponent(origin);
    if(params.video){
        return "https://www.youtube.com/embed/"+encodeURIComponent(params.video)+"?"+common;
    }
    if(params.channel){
        return "https://www.youtube.com/embed/live_stream?channel="+encodeURIComponent(params.channel)+"&"+common;
    }
    return "";
}
function onPlayerReady(){
    hideMessage();
    postToParent("ready");
    try{player.playVideo();}catch(ignore){}
}
function onPlayerStateChange(event){postToParent("state",{state:event.data});}
function onPlayerError(event){
    showMessage("YouTube yayını açılamadı","Hata kodu: "+event.data);
    postToParent("error",{code:event.data});
}
window.onYouTubeIframeAPIReady=function(){
    try{
        player=new YT.Player("yt-player",{events:{onReady:onPlayerReady,onStateChange:onPlayerStateChange,onError:onPlayerError}});
    }catch(error){
        showMessage("YouTube player başlatılamadı",error.message||"");
        postToParent("error",{message:error.message||"player init"});
    }
};
function handleCommand(command){
    if(!player||!command){return;}
    try{
        if(command==="play"){player.playVideo();}
        else if(command==="pause"){player.pauseVideo();}
        else if(command==="stop"){player.stopVideo();}
        else if(command==="mute"){player.mute();}
        else if(command==="unmute"){player.unMute();}
    }catch(ignore){}
}
window.addEventListener("message",function(event){
    var data=event.data||{};
    if(typeof data==="string"){handleCommand(data);return;}
    if(data.command){handleCommand(data.command);}
},false);

var sourceUrl=buildSource();
if(!sourceUrl){
    showMessage("Türkiye TV YouTube Player hazır","URL'ye ?channel=KANAL_ID veya ?video=VIDEO_ID ekleyin.");
    return;
}
iframe.src=sourceUrl;
var apiScript=document.createElement("script");
apiScript.src="https://www.youtube.com/iframe_api";
document.head.appendChild(apiScript);
}());
</script>
</body>
</html>
